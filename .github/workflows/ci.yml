name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pi ${{ matrix.pi-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version:
          - "0.80.6"
          - "0.83.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin Pi packages
        run: |
          npm install --no-save --package-lock=false \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }}

      - name: Verify Pi package versions
        env:
          EXPECTED_PI_VERSION: ${{ matrix.pi-version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packages = ["pi-agent-core", "pi-ai", "pi-coding-agent", "pi-tui"];
          for (const name of packages) {
            const path = `node_modules/@earendil-works/${name}/package.json`;
            const { version } = JSON.parse(readFileSync(path, "utf8"));
            if (version !== process.env.EXPECTED_PI_VERSION) {
              throw new Error(`${name}: expected ${process.env.EXPECTED_PI_VERSION}, got ${version}`);
            }
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run
